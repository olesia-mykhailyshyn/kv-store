AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  kv-store M2 application (stack kv-app): coordinator and two shards in private
  subnets, a client (YCSB, curl) in a public subnet, security groups, user data
  that installs the code from S3 as systemd services, and a smoke test on the
  client that reports back with cfn-signal. The stack is replaced, not updated,
  on every deploy (design decision 8). See openspec/changes/add-m2-sharding/design.md
  (decisions 7-9), specs/app-infrastructure and docs/adr/0008, 0009, 0010.

Parameters:
  CodeVersion:
    Type: String
    Description: Version of the code archive (git SHA); the servers download code/<CodeVersion>.zip
    AllowedPattern: "^[A-Za-z0-9._-]{1,64}$"

  AdminCidr:
    Type: String
    Description: The only address range allowed to SSH to the client, e.g. 203.0.113.7/32
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$"
    ConstraintDescription: must be an IPv4 CIDR such as 203.0.113.7/32

  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair for SSH to the client (empty = EC2 Instance Connect only)

  # CloudFormation has no lookup of a managed prefix list by name, so the ID is a
  # parameter. Default = com.amazonaws.us-east-1.ec2-instance-connect, found with
  #   aws ec2 describe-managed-prefix-lists --region us-east-1 \
  #     --filters Name=prefix-list-name,Values=com.amazonaws.us-east-1.ec2-instance-connect
  InstanceConnectPrefixListId:
    Type: String
    Default: pl-0e4bcff02b13bef1e
    Description: AWS-managed prefix list of EC2 Instance Connect (browser SSH) in us-east-1
    AllowedPattern: "^pl-[0-9a-f]+$"

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

# Refuse to create the stack if SSH would be open to the whole internet.
Rules:
  AdminCidrIsNotTheInternet:
    Assertions:
      - Assert: !Not [!Equals [!Ref AdminCidr, "0.0.0.0/0"]]
        AssertDescription: AdminCidr must not be 0.0.0.0/0

Resources:
  # ---------------------------------------------------------------- security
  # Allowed traffic (spec app-infrastructure, "Мінімальний мережевий доступ"):
  #   client      -> coordinator 8080   (API)
  #   coordinator -> shards      8080   (internal API)
  #   shards      -> coordinator 8080   (POST /shards/register heartbeat)
  #   AdminCidr and EC2 Instance Connect -> client 22 (SSH)
  # Everything else inbound is denied (a security group denies by default).
  # Egress stays at the default "all": the client needs the internet (dnf,
  # CloudFormation API), the servers need S3 through the gateway endpoint.
  ClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: kv-store client - SSH only from AdminCidr and EC2 Instance Connect
      VpcId: !ImportValue kv-network-VpcId
      SecurityGroupIngress:
        - Description: SSH from the admin address range
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
        - Description: SSH from EC2 Instance Connect (browser)
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourcePrefixListId: !Ref InstanceConnectPrefixListId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-client-sg

  CoordinatorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: kv-store coordinator - port 8080 only from the client and the shards
      VpcId: !ImportValue kv-network-VpcId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-coordinator-sg

  ShardSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: kv-store shards - port 8080 only from the coordinator
      VpcId: !ImportValue kv-network-VpcId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-shard-sg

  # The coordinator and shard groups point at each other, so the rules are
  # separate resources (inline rules would make a circular dependency).
  CoordinatorFromClient:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CoordinatorSecurityGroup
      Description: API from the client
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref ClientSecurityGroup

  CoordinatorFromShards:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CoordinatorSecurityGroup
      Description: Shard registration and heartbeat
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref ShardSecurityGroup

  ShardFromCoordinator:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ShardSecurityGroup
      Description: Internal API from the coordinator
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref CoordinatorSecurityGroup

  # ---------------------------------------------------------------- servers
  # All four: latest Amazon Linux 2023 (public SSM parameter), the sandbox
  # instance profile myS3Role (IAM is read-only, we cannot create our own),
  # IMDSv2 only (HttpTokens: required), root EBS gp2 8 GB that holds the WAL.
  # User data output is in /var/log/cloud-init-output.log on each server.

  Coordinator:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      SubnetId: !ImportValue kv-network-PrivateSubnetAId
      SecurityGroupIds:
        - !Ref CoordinatorSecurityGroup
      IamInstanceProfile: myS3Role
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp2
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-coordinator
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # First boot of the coordinator. Stop on the first error.
            set -euo pipefail

            # 1. Code from S3 (no internet here: the request goes through the
            #    S3 gateway endpoint). Retry while the instance role becomes ready.
            for attempt in $(seq 1 30); do
              aws s3 cp "s3://${CodeBucket}/code/${CodeVersion}.zip" /tmp/kvstore.zip --region ${AWS::Region} && break
              echo "code download attempt $attempt failed, retrying in 10 s"
              sleep 10
            done
            test -f /tmp/kvstore.zip

            # 2. Unpack with Python's own zipfile module (no extra packages).
            mkdir -p /opt/kvstore
            python3 -m zipfile -e /tmp/kvstore.zip /opt/kvstore/

            # 3. A system user without login owns the data directory (WAL files).
            useradd --system --no-create-home --shell /sbin/nologin kvstore
            install -d -o kvstore -g kvstore /var/lib/kvstore

            # 4. systemd service: starts on boot, restarts if the process dies.
            cat > /etc/systemd/system/kvstore-coordinator.service <<'UNIT'
            [Unit]
            Description=kv-store coordinator
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=kvstore
            Environment=PYTHONPATH=/opt/kvstore
            Environment=PYTHONUNBUFFERED=1
            ExecStart=/usr/bin/python3 -m kvstore.coordinator --mode sharded --host 0.0.0.0 --port 8080 --data-dir /var/lib/kvstore
            Restart=always
            RestartSec=2

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now kvstore-coordinator
          - CodeBucket: !ImportValue kv-artifacts-CodeBucket

  Shard1:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      SubnetId: !ImportValue kv-network-PrivateSubnetBId
      SecurityGroupIds:
        - !Ref ShardSecurityGroup
      IamInstanceProfile: myS3Role
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp2
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-shard-1
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # First boot of a shard. Same steps as the coordinator, plus the
            # shard's own address for registration.
            set -euo pipefail

            for attempt in $(seq 1 30); do
              aws s3 cp "s3://${CodeBucket}/code/${CodeVersion}.zip" /tmp/kvstore.zip --region ${AWS::Region} && break
              echo "code download attempt $attempt failed, retrying in 10 s"
              sleep 10
            done
            test -f /tmp/kvstore.zip
            mkdir -p /opt/kvstore
            python3 -m zipfile -e /tmp/kvstore.zip /opt/kvstore/
            useradd --system --no-create-home --shell /sbin/nologin kvstore
            install -d -o kvstore -g kvstore /var/lib/kvstore

            # Own private IP from instance metadata, IMDSv2: first a session
            # token (PUT), then the request with that token.
            # own private IP from instance metadata (IMDSv2), with retries like the S3 download
            MY_IP=""
            for attempt in $(seq 1 10); do
              TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300") \
                && MY_IP=$(curl -sf -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4) \
                && break
              sleep 2
            done
            test -n "$MY_IP"

            # Unquoted heredoc: bash fills in $MY_IP; CloudFormation already
            # filled in the coordinator IP and the shard id.
            cat > /etc/systemd/system/kvstore-shard.service <<UNIT
            [Unit]
            Description=kv-store shard ${ShardId}
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=kvstore
            Environment=PYTHONPATH=/opt/kvstore
            Environment=PYTHONUNBUFFERED=1
            ExecStart=/usr/bin/python3 -m kvstore.shard --id ${ShardId} --host 0.0.0.0 --port 8080 --data-dir /var/lib/kvstore --coordinator-url http://${CoordinatorIp}:8080 --advertise-url http://$MY_IP:8080 --heartbeat-seconds 5
            Restart=always
            RestartSec=2

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now kvstore-shard
          - CodeBucket: !ImportValue kv-artifacts-CodeBucket
            CoordinatorIp: !GetAtt Coordinator.PrivateIp
            ShardId: shard-1

  Shard2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      SubnetId: !ImportValue kv-network-PrivateSubnetCId
      SecurityGroupIds:
        - !Ref ShardSecurityGroup
      IamInstanceProfile: myS3Role
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp2
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-shard-2
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # First boot of a shard (identical to Shard1 except ShardId).
            set -euo pipefail

            for attempt in $(seq 1 30); do
              aws s3 cp "s3://${CodeBucket}/code/${CodeVersion}.zip" /tmp/kvstore.zip --region ${AWS::Region} && break
              echo "code download attempt $attempt failed, retrying in 10 s"
              sleep 10
            done
            test -f /tmp/kvstore.zip
            mkdir -p /opt/kvstore
            python3 -m zipfile -e /tmp/kvstore.zip /opt/kvstore/
            useradd --system --no-create-home --shell /sbin/nologin kvstore
            install -d -o kvstore -g kvstore /var/lib/kvstore

            # own private IP from instance metadata (IMDSv2), with retries like the S3 download
            MY_IP=""
            for attempt in $(seq 1 10); do
              TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300") \
                && MY_IP=$(curl -sf -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4) \
                && break
              sleep 2
            done
            test -n "$MY_IP"

            cat > /etc/systemd/system/kvstore-shard.service <<UNIT
            [Unit]
            Description=kv-store shard ${ShardId}
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=kvstore
            Environment=PYTHONPATH=/opt/kvstore
            Environment=PYTHONUNBUFFERED=1
            ExecStart=/usr/bin/python3 -m kvstore.shard --id ${ShardId} --host 0.0.0.0 --port 8080 --data-dir /var/lib/kvstore --coordinator-url http://${CoordinatorIp}:8080 --advertise-url http://$MY_IP:8080 --heartbeat-seconds 5
            Restart=always
            RestartSec=2

            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now kvstore-shard
          - CodeBucket: !ImportValue kv-artifacts-CodeBucket
            CoordinatorIp: !GetAtt Coordinator.PrivateIp
            ShardId: shard-2

  # The client is the only server with a public IP. Its user data is the
  # smoke test of design decision 9: it runs inside the VPC (the coordinator is
  # private) and reports the result to CloudFormation with cfn-signal. Without
  # a success signal in 10 minutes the kv-app stack fails, so CD goes red.
  # The smoke test is inline here (not a script in the code zip) because the
  # client never downloads the code archive: it only needs curl and python3.
  Client:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT10M
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.small
      IamInstanceProfile: myS3Role
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !ImportValue kv-network-PublicSubnetAId
          AssociatePublicIpAddress: true
          GroupSet:
            - !Ref ClientSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp2
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-client
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # No "set -e": every failure path must still reach cfn-signal.
            set -uo pipefail
            COORD=http://${CoordinatorIp}:8080

            # Settings for scripts/ycsb-run.sh (it sources this file): the client role
            # cannot read stack exports, so the template writes them here.
            mkdir -p /etc/kvstore
            cat > /etc/kvstore/client.env <<ENV
            KV_URL=$COORD
            RESULTS_BUCKET=${ResultsBucket}
            ENV

            # cfn-signal comes from aws-cfn-bootstrap (the client has internet).
            # If even this fails, no signal is sent and the 10 min timeout fails the stack.
            dnf install -y aws-cfn-bootstrap

            signal() {
              /opt/aws/bin/cfn-signal --exit-code "$1" --reason "$2" \
                --stack ${AWS::StackName} --resource Client --region ${AWS::Region}
            }
            fail() {
              echo "SMOKE TEST FAILED: $1"
              signal 1 "smoke test failed: $1"
              exit 1
            }

            # 1. Wait (up to 8 min) until the coordinator answers /health and
            #    both shards have registered; before that a PUT would get 503.
            shards=0
            for attempt in $(seq 1 96); do
              shards=$(curl -s --max-time 3 "$COORD/health" \
                | python3 -c 'import json, sys; print(len(json.load(sys.stdin).get("shards", [])))' 2>/dev/null) || shards=0
              [ "$shards" -ge 2 ] && break
              sleep 5
            done
            [ "$shards" -ge 2 ] || fail "coordinator not healthy with 2 shards after 8 min"
            echo "coordinator healthy, shards registered: $shards"

            # 2. check EXPECTED_CODE CURL_ARGS... : one request, compare the status code.
            check() {
              expected=$1
              shift
              code=$(curl -s -o /tmp/smoke-body -w '%{http_code}' --max-time 5 "$@")
              echo "$* -> $code"
              [ "$code" = "$expected" ] || fail "expected $expected, got $code for $*"
            }

            # A fresh table name each run, so a rerun never hits 409.
            TABLE=smoke_$(date +%s)_$RANDOM
            JSON='Content-Type: application/json'
            check 201 -X POST -H "$JSON" -d "{\"name\": \"$TABLE\", \"partitionKey\": \"id\"}" "$COORD/tables"
            check 201 -X PUT -H "$JSON" -d '{"id": "k1", "value": {"n": 1}}' "$COORD/tables/$TABLE/items"
            check 200 "$COORD/tables/$TABLE/items/k1"
            python3 -c 'import json; assert json.load(open("/tmp/smoke-body"))["value"] == {"n": 1}' \
              || fail "GET returned a different value"
            check 200 -I "$COORD/tables/$TABLE/items/k1"
            check 204 -X DELETE "$COORD/tables/$TABLE/items/k1"
            check 404 "$COORD/tables/$TABLE/items/k1"

            signal 0 "smoke test passed"
            echo "SMOKE TEST PASSED"

            # 3. After the signal (so it does not slow the deploy): Java for YCSB.
            dnf install -y java-17-amazon-corretto-headless
          - CoordinatorIp: !GetAtt Coordinator.PrivateIp
            ResultsBucket: !ImportValue kv-artifacts-ResultsBucket

Outputs:
  CoordinatorPrivateIp:
    Description: Private IP of the coordinator
    Value: !GetAtt Coordinator.PrivateIp

  CoordinatorUrl:
    Description: Coordinator API base URL (reachable only from the client)
    Value: !Sub http://${Coordinator.PrivateIp}:8080

  Shard1PrivateIp:
    Description: Private IP of shard-1
    Value: !GetAtt Shard1.PrivateIp

  Shard2PrivateIp:
    Description: Private IP of shard-2
    Value: !GetAtt Shard2.PrivateIp

  ClientPublicIp:
    Description: Public IP of the client (SSH, YCSB)
    Value: !GetAtt Client.PublicIp
